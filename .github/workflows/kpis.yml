name: Build KPI JSON

on:
  schedule:
    - cron: "*/30 * * * *"   # aux 30 min (UTC). Ajuste au besoin.
  workflow_dispatch: {}        # bouton "Run" manuel
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/kpis.yml"

permissions:
  contents: write              # pour committer docs/data/kpis.json

concurrency:
  group: kpis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build kpis.json
        env:
          GHL_TOKEN:             ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID:       ${{ secrets.GHL_LOCATION_ID }}
          JOBBER_CLIENT_ID:      ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET:  ${{ secrets.JOBBER_CLIENT_SECRET }}
          JOBBER_REFRESH_TOKEN:  ${{ secrets.JOBBER_REFRESH_TOKEN }}
          META_TOKEN:            ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT:       ${{ secrets.META_AD_ACCOUNT }}
          LOADED_RATE:           ${{ vars.LOADED_RATE }}
        run: python scripts/build_kpis.py

      - name: Commit if changed
        run: |
          git config user.name  "kpi-bot"
          git config user.email "kpi-bot@users.noreply.github.com"
          git add docs/data/kpis.json docs/data/history.json
          git diff --staged --quiet || git commit -m "chore: refresh kpis.json [skip ci]"
          git pull --rebase origin main
          git push
