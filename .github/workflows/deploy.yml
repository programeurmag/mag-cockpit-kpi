name: Build & deploy dashboard (Vite)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # docs/data/*.json (kpis.json, history.json) est écrit par le workflow
      # kpis.yml séparément — on ne touche jamais à docs/data/ ici. On efface
      # juste les anciens bundles JS/CSS pour éviter l'accumulation (Vite
      # hash les noms de fichiers, emptyOutDir est désactivé dans
      # vite.config.js pour protéger docs/data/).
      - name: Clean old build assets
        run: rm -rf docs/assets docs/index.html

      - name: Build
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name  "kpi-bot"
          git config user.email "kpi-bot@users.noreply.github.com"
          git add docs/index.html docs/assets
          git diff --staged --quiet || git commit -m "chore: build dashboard [skip ci]"
          git pull --rebase origin main
          git push
